# Single-package workspace (pnpm v11 project settings).
strictPeerDependencies: false
autoInstallPeers: true
nodeLinker: hoisted
blockExoticSubdeps: false

overrides:
  "lockwright-lib-constants": "git+https://github.com/Dexterity-Works/lockwright-lib-constants.git#f6142c9554e9f972519dd8115b2b73f02b73d5fb"
  "lockwright-lib-ui-react-native-components": "git+https://github.com/Dexterity-Works/lockwright-lib-ui-react-native-components.git#5a4ed69feda9b76c0de6f40cb12df72569beb9b4"
  "kdbxweb>@xmldom/xmldom": "0.8.15"

publicHoistPattern:
  - '*react-native*'
  - '*expo*'

allowBuilds:
  "lockwright-lib-vault-core@file:../pearpass-lib-vault-core": true
  "lockwright-lib-vault@file:../pearpass-lib-vault": true
  "@sentry/cli@3.4.0": true
  "esbuild@0.25.12": true
  "unrs-resolver@1.12.2": true
